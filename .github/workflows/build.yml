name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/grocery-erp-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=grocery-erp-keystore.jks" >> android/key.properties
          echo "Keystore decoded"
          ls -la android/grocery-erp-keystore.jks android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: artifacts/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: الإصدار ${{ steps.version.outputs.VERSION }}
          body: |
            # 🏪 نظام البقالة المحاسبي ${{ steps.version.outputs.VERSION }}

            ## 📥 التحميل والتثبيت
            1. حمّل ملف `app-release.apk`
            2. انقله إلى جهاز Android
            3. فعّل "تثبيت من مصادر غير معروفة"
            4. افتح ملف APK وثبّت التطبيق

            ## 🔑 بيانات الدخول
            - اسم المستخدم: admin
            - كلمة المرور: admin123

            > ⚠️ غيّر كلمة المرور فور أول تسجيل دخول.

            ## ✨ المميزات
            - ✅ يعمل بالكامل بدون إنترنت
            - ✅ معاملات ذرية لكل العمليات المالية
            - ✅ نظام صلاحيات كامل (7 أدوار، 43 صلاحية)
            - ✅ سجل تدقيق كامل
            - ✅ نسخ احتياطي واستعادة
            - ✅ دعم العربية و RTL
            - ✅ الوضع الفاتح والداكن
            - ✅ توقيع إنتاجي صحيح

            --
            صُنع بـ ❤️ باستخدام Flutter
          files: artifacts/app-release.apk
          draft: false
          prerelease: false
