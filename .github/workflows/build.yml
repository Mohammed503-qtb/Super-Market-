name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-erp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-erp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: grocery-erp-release-apk
          path: artifacts/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: الإصدار ${{ steps.version.outputs.VERSION }}
          body: |
            # 🏪 نظام البقالة المحاسبي ${{ steps.version.outputs.VERSION }}

            ## 📥 التحميل
            حمّل ملف `app-release.apk` من الأسفل وثبّته على جهاز Android.

            ## 🔑 بيانات الدخول الافتراضية
            - **اسم المستخدم**: `admin`
            - **كلمة المرور**: `admin123`

            > ⚠️ **تحذير**: غيّر كلمة المرور الافتراضية فور أول تسجيل دخول.

            ## ✨ المميزات
            - ✅ يعمل بالكامل بدون إنترنت (Offline First)
            - ✅ معاملات ذرية لكل العمليات المالية
            - ✅ نظام صلاحيات كامل (7 أدوار، 43 صلاحية)
            - ✅ سجل تدقيق كامل (Audit Log)
            - ✅ نسخ احتياطي واستعادة محلي
            - ✅ دعم العربية و RTL
            - ✅ الوضع الفاتح والداكن
            - ✅ تصميم متجاوب

            ## 📋 الوحدات
            - الكاشير (POS)
            - المبيعات والمشتريات
            - المخزون مع التكلفة المرجحة
            - العملاء والموردون
            - الصندوق والمصروفات
            - التقارير الشاملة
            - المستخدمون والصلاحيات
            - النسخ الاحتياطي

            ## 🔧 التقنيات
            - Flutter 3.27.0 + Dart 3.6.0
            - Drift ORM (SQLite)
            - Provider (State Management)
            - 84 اختبار وحدة (100% نجاح)

            --
            صُنع بـ ❤️ باستخدام Flutter
          files: artifacts/app-release.apk
          draft: false
          prerelease: false
