name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Decode keystore from secrets (for signed release builds)
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/grocery-erp-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=grocery-erp-keystore.jks" >> android/key.properties
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret found, will use debug signing"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-erp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: grocery-erp-release-apk
          path: artifacts/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: الإصدار ${{ steps.version.outputs.VERSION }}
          body: |
            # 🏪 نظام البقالة المحاسبي ${{ steps.version.outputs.VERSION }}

            ## 📥 التحميل والتثبيت
            1. حمّل ملف `app-release.apk` من الأسفل
            2. انقله إلى جهاز Android
            3. فعّل "تثبيت من مصادر غير معروفة" في الإعدادات
            4. افتح ملف APK وثبّت التطبيق

            ## 🔑 بيانات الدخول الافتراضية
            - **اسم المستخدم**: `admin`
            - **كلمة المرور**: `admin123`

            > ⚠️ **تحذير**: غيّر كلمة المرور الافتراضية فور أول تسجيل دخول.

            ## ✨ المميزات
            - ✅ يعمل بالكامل بدون إنترنت (Offline First)
            - ✅ معاملات ذرية لكل العمليات المالية
            - ✅ نظام صلاحيات كامل (7 أدوار، 43 صلاحية)
            - ✅ سجل تدقيق كامل (Audit Log)
            - ✅ نسخ احتياطي واستعادة محلي
            - ✅ دعم العربية و RTL
            - ✅ الوضع الفاتح والداكن
            - ✅ تصميم متجاوب
            - ✅ توقيع إنتاجي صحيح (RSA 2048-bit)

            ## 📋 الوحدات
            - الكاشير (POS)
            - المبيعات والمشتريات
            - المخزون مع التكلفة المرجحة
            - العملاء والموردون
            - الصندوق والمصروفات
            - التقارير الشاملة
            - المستخدمون والصلاحيات
            - النسخ الاحتياطي

            ## 🔧 التقنيات
            - Flutter 3.27.0 + Dart 3.6.0
            - Drift ORM (SQLite)
            - Provider (State Management)
            - 84 اختبار وحدة (100% نجاح)

            --
            صُنع بـ ❤️ باستخدام Flutter
          files: artifacts/app-release.apk
          draft: false
          prerelease: false
